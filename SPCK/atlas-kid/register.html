<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký – Atlas Kid</title>
  <meta name="description" content="Tạo tài khoản Atlas Kid để lập sổ tay hành trình của riêng bạn.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
</head>
<body>
  <!-- Trang đăng nhập / đăng ký không có header và footer: logo trong khối giới thiệu dùng để về trang chủ -->

  <!-- ==================== NỘI DUNG CHÍNH (main) – BẮT ĐẦU ==================== -->
  <main class="auth-layout">
    <section class="auth-panel">
      <a class="brand auth-brand" href="index.html"><span class="brand-logo" aria-hidden="true">🌍</span>Atlas Kid</a>
      <h1>Tạo sổ tay hành trình của riêng bạn</h1>
      <ul class="auth-points">
        <li><span class="point-icon" aria-hidden="true">🌏</span>Lưu bao nhiêu quốc gia tuỳ thích</li>
        <li><span class="point-icon" aria-hidden="true">📝</span>Viết ghi chú cho từng điểm đến</li>
        <li><span class="point-icon" aria-hidden="true">👤</span>Cập nhật hồ sơ bất cứ lúc nào</li>
      </ul>
      <div class="flag-row" aria-hidden="true">
        <img src="https://flags.restcountries.com/v5/svg/vn.svg" alt="">
        <img src="https://flags.restcountries.com/v5/svg/jp.svg" alt="">
        <img src="https://flags.restcountries.com/v5/svg/fr.svg" alt="">
        <img src="https://flags.restcountries.com/v5/svg/br.svg" alt="">
        <img src="https://flags.restcountries.com/v5/svg/au.svg" alt="">
      </div>
    </section>

    <section class="auth-side">
      <div class="card-x auth-card wide">
        <h2 class="auth-title">Đăng ký</h2>
        <div id="registerAlert"></div>
        <form id="registerForm" novalidate>
          <div class="register-grid">
            <div class="mb-3">
              <label class="form-label" for="regName">Họ và tên<span class="required-mark" aria-hidden="true">*</span></label>
              <input class="form-control" type="text" id="regName" required autocomplete="name" aria-describedby="regNameError">
              <div class="field-error" id="regNameError"></div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="regAge">Tuổi<span class="required-mark" aria-hidden="true">*</span></label>
              <input class="form-control" type="number" id="regAge" required min="6" max="100" step="1" inputmode="numeric" aria-describedby="regAgeError regAgeHint">
              <div class="field-error" id="regAgeError"></div>
              <div class="form-hint" id="regAgeHint">Nhập số từ 6 đến 100</div>
            </div>
            <div class="mb-3 span-2">
              <label class="form-label" for="regEmail">Email<span class="required-mark" aria-hidden="true">*</span></label>
              <input class="form-control" type="email" id="regEmail" required autocomplete="email" placeholder="ban@gmail.com" aria-describedby="regEmailError">
              <div class="field-error" id="regEmailError"></div>
            </div>
            <div class="mb-3 span-2">
              <label class="form-label" for="regAddress">Địa chỉ<span class="required-mark" aria-hidden="true">*</span></label>
              <input class="form-control" type="text" id="regAddress" required maxlength="120" autocomplete="street-address" placeholder="Ví dụ: Quận Hải Châu, Đà Nẵng" aria-describedby="regAddressError">
              <div class="field-error" id="regAddressError"></div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="regPassword">Mật khẩu<span class="required-mark" aria-hidden="true">*</span></label>
              <input class="form-control" type="password" id="regPassword" required autocomplete="new-password" aria-describedby="regPasswordError regPasswordHint">
              <div class="field-error" id="regPasswordError"></div>
              <div class="form-hint" id="regPasswordHint">Ít nhất 6 ký tự</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="regConfirm">Nhập lại mật khẩu<span class="required-mark" aria-hidden="true">*</span></label>
              <input class="form-control" type="password" id="regConfirm" required autocomplete="new-password" aria-describedby="regConfirmError">
              <div class="field-error" id="regConfirmError"></div>
            </div>
          </div>
          <button class="btn btn-sun btn-lg-pill w-100 mt-2" type="submit">Tạo tài khoản</button>
        </form>
        <p class="auth-switch">Đã có tài khoản? <a class="keep-next" href="login.html">Đăng nhập</a></p>
      </div>
    </section>
  </main>
  <!-- ==================== NỘI DUNG CHÍNH – KẾT THÚC ==================== -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
