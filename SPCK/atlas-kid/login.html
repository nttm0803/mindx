<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập – Atlas Kid</title>
  <meta name="description" content="Đăng nhập Atlas Kid để xem lại sổ tay hành trình của bạn.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
</head>
<body>
  <!-- Trang đăng nhập / đăng ký không có header và footer: logo trong khối giới thiệu dùng để về trang chủ -->

  <!-- ==================== NỘI DUNG CHÍNH (main) – BẮT ĐẦU ==================== -->
  <main class="auth-layout">
    <section class="auth-panel">
      <a class="brand auth-brand" href="index.html"><span class="brand-logo" aria-hidden="true">🌍</span>Atlas Kid</a>
      <h1>Chào mừng bạn quay lại!</h1>
      <ul class="auth-points">
        <li><span class="point-icon" aria-hidden="true">📍</span>Xem lại những nơi bạn muốn đến</li>
        <li><span class="point-icon" aria-hidden="true">✏️</span>Cập nhật ghi chú và kế hoạch</li>
        <li><span class="point-icon" aria-hidden="true">🏁</span>Đánh dấu những quốc gia đã đến</li>
      </ul>
      <div class="flag-row" aria-hidden="true">
        <img src="https://flags.restcountries.com/v5/svg/vn.svg" alt="">
        <img src="https://flags.restcountries.com/v5/svg/jp.svg" alt="">
        <img src="https://flags.restcountries.com/v5/svg/fr.svg" alt="">
        <img src="https://flags.restcountries.com/v5/svg/br.svg" alt="">
        <img src="https://flags.restcountries.com/v5/svg/au.svg" alt="">
      </div>
    </section>

    <section class="auth-side">
      <div class="card-x auth-card">
        <h2 class="auth-title">Đăng nhập</h2>
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="loginEmail">Email</label>
            <input class="form-control" type="email" id="loginEmail" autocomplete="email" placeholder="ban@gmail.com" aria-describedby="loginEmailError">
            <div class="field-error" id="loginEmailError"></div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="loginPassword">Mật khẩu</label>
            <input class="form-control" type="password" id="loginPassword" autocomplete="current-password" aria-describedby="loginPasswordError">
            <div class="field-error" id="loginPasswordError"></div>
          </div>
          <div id="loginAlert"></div>
          <button class="btn btn-sun btn-lg-pill w-100" type="submit">Đăng nhập</button>
        </form>
        <p class="auth-switch">Chưa có tài khoản? <a class="keep-next" href="register.html">Đăng ký ngay</a></p>
      </div>
    </section>
  </main>
  <!-- ==================== NỘI DUNG CHÍNH – KẾT THÚC ==================== -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
