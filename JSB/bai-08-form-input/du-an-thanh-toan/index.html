<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - ShopTeen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- method="post": thông tin cá nhân và thanh toán → không để lộ trên thanh địa chỉ.
         Như form đăng nhập: chưa có server nên Live Server có thể báo "Cannot POST".
         Tạm đổi method="get" để kiểm tra mọi ô đã có name và gửi đủ dữ liệu chưa. -->
    <form class="hop-thanh-toan" action="" method="post">
        <p class="logo">🛍 ShopTeen</p>
        <h1>Thanh toán</h1>

        <!-- Tóm tắt đơn hàng: chỉ là chữ để xem, không phải ô nhập -->
        <div class="don-hang">
            <p>🎒 Balo đi học <span>250.000đ</span></p>
            <p>🎧 Tai nghe không dây <span>390.000đ</span></p>
            <p class="tong">Tổng cộng <span>640.000đ</span></p>
        </div>

        <!-- NHÓM 1: fieldset gom các ô liên quan, legend là tiêu đề nhóm -->
        <fieldset>
            <legend>1. Thông tin người nhận</legend>

            <label for="ho-ten">Họ tên</label>
            <input type="text" id="ho-ten" name="ho_ten" placeholder="Nguyễn Văn An" required>

            <label for="sdt">Số điện thoại</label>
            <!-- pattern: đúng 10 chữ số -->
            <input type="tel" id="sdt" name="sdt" placeholder="0912345678" pattern="[0-9]{10}" required>

            <label for="tinh">Tỉnh/Thành phố</label>
            <!-- option đầu có value="" + required → bắt buộc phải chọn 1 tỉnh -->
            <select id="tinh" name="tinh" required>
                <option value="">-- Chọn tỉnh --</option>
                <option value="ha-noi">Hà Nội</option>
                <option value="da-nang">Đà Nẵng</option>
                <option value="ho-chi-minh">TP. Hồ Chí Minh</option>
            </select>

            <label for="dia-chi">Địa chỉ</label>
            <textarea id="dia-chi" name="dia_chi" rows="2" placeholder="Số nhà, tên đường, phường/xã" required></textarea>
        </fieldset>

        <!-- NHÓM 2: radio cùng name="thanh_toan" → chỉ chọn được 1 -->
        <fieldset>
            <legend>2. Phương thức thanh toán</legend>
            <label class="lua-chon"><input type="radio" name="thanh_toan" value="cod" checked> 💵 Thanh toán khi nhận hàng</label>
            <label class="lua-chon"><input type="radio" name="thanh_toan" value="chuyen_khoan"> 🏦 Chuyển khoản ngân hàng</label>
            <label class="lua-chon"><input type="radio" name="thanh_toan" value="the"> 💳 Thẻ ATM</label>
        </fieldset>

        <!-- required trên checkbox → chưa tích thì không đặt hàng được -->
        <label class="lua-chon">
            <input type="checkbox" name="dong_y" value="co" required> Tôi đồng ý với điều khoản mua hàng
        </label>

        <!-- Nút chính DUY NHẤT (Bài 7) -->
        <button type="submit" class="nut-dat-hang">Đặt hàng</button>
    </form>

    <p class="ve-bai"><a href="../index.html#thanh-toan">⬅ Về Bài 8</a></p>
</body>
</html>
