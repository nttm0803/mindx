<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Social – Banner (Hero)</title>
    <!-- Phông chữ Google Fonts (cần Internet, không có vẫn chạy bằng phông dự phòng) -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Gắn Bootstrap TRƯỚC -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Gắn style.css SAU để CSS của em đè được Bootstrap -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<section class="hero nen-xanh text-white">
    <div class="container py-5">
        <div class="row align-items-center g-5">

            <!-- Cột trái: chữ -->
            <div class="col-md-6">
                <h1 class="display-4 fw-bold">Cún của bạn xứng đáng có thêm bạn mới.</h1>
                <p class="fs-5 mt-3">Dog Social giúp chủ nuôi tìm những chú chó hợp tính, hẹn đi dạo và kết nối với nhau chỉ trong vài lần chạm.</p>
                <a href="#" class="btn btn-vang btn-lg fw-bold me-2 mb-2">Tham gia miễn phí</a>
                <a href="#" class="btn btn-outline-light btn-lg mb-2">Xem cách hoạt động</a>
            </div>

            <!-- Cột phải: khung điện thoại -->
            <div class="col-md-6">
                <div class="dien-thoai mx-auto">
                    <div class="man-hinh">
                        <div class="fw-bold mb-2">🐾 Dog Social</div>
                        <div class="the-cun">
                            <div class="anh-cun">🐶</div>
                            <div class="p-3 text-dark">
                                <b>Mochi, 2 tuổi</b><br>
                                <small class="text-secondary">Cách bạn 800 m</small><br>
                                <span class="badge text-bg-primary">Poodle</span>
                                <span class="badge text-bg-primary">Hiền</span>
                            </div>
                        </div>
                        <div class="text-center mt-3">
                            <span class="nut-tron">✕</span>
                            <span class="nut-tron nut-tim">♥</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>

    <!-- JavaScript của Bootstrap: cần cho carousel (bước 4) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
